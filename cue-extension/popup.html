<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      color: #ffffff;
    }
    .title { font-size: 14px; font-weight: 800; margin: 0; color: #f8fafc; }
    .subtitle { font-size: 11px; color: #94a3b8; margin: 2px 0 0 0; }
    .badge {
      margin-left: auto;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #818cf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    input[type="text"]:focus { border-color: #3b82f6; }
    .btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.4;
      display: none;
    }
    .status.success { display: block; background-color: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }
    .status.error   { display: block; background-color: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }
    .status.info    { display: block; background-color: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: #60a5fa; }

    .divider {
      height: 1px;
      background: #1e293b;
      margin: 14px 0;
    }

    /* Auto-sync toggle row */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 10px;
    }
    .toggle-info { flex: 1; }
    .toggle-label { font-size: 12px; font-weight: 700; color: #f8fafc; }
    .toggle-sublabel { font-size: 10px; color: #64748b; margin-top: 2px; }

    /* iOS-style toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
      margin-left: 10px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: 0.3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(16px); }

    /* Last sync info */
    .last-sync {
      font-size: 10px;
      color: #475569;
      text-align: center;
      margin-top: 8px;
      line-height: 1.4;
    }
    .last-sync .ok { color: #34d399; }
    .last-sync .fail { color: #f87171; }

    .hint {
      font-size: 10px;
      color: #64748b;
      margin-top: 12px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">A</div>
    <div>
      <h1 class="title">AcadSphere CUE Sync</h1>
      <p class="subtitle">Extract live attendance from CUE Portal</p>
    </div>
    <span class="badge">v2.0</span>
  </div>

  <div class="form-group">
    <label for="userId">AcadSphere User ID</label>
    <input type="text" id="userId" placeholder="Paste your User ID from AcadSphere" />
  </div>

  <button id="syncBtn" class="btn">⚡ Sync to AcadSphere Now</button>

  <div id="statusMsg" class="status"></div>

  <div class="divider"></div>

  <!-- Auto-sync toggle -->
  <div class="toggle-row">
    <div class="toggle-info">
      <div class="toggle-label">🔄 Auto-Sync (Every 6 hrs)</div>
      <div class="toggle-sublabel">Silently syncs in the background automatically</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="autoSyncToggle" />
      <span class="slider"></span>
    </label>
  </div>

  <button id="bgSyncBtn" class="btn" style="background: linear-gradient(135deg, #0f766e, #0891b2); margin-top: 0;">
    🤖 Run Background Sync Now
  </button>

  <div id="lastSyncInfo" class="last-sync">Loading last sync info...</div>

  <p class="hint">
    Make sure you are on <strong>cue.christuniversity.in/main/attendence</strong> for manual sync.<br>
    Auto-sync opens a hidden tab automatically.
  </p>

  <script src="popup.js"></script>
</body>
</html>
