<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      color: #ffffff;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      margin: 0;
      color: #f8fafc;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin: 2px 0 0 0;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
    .btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.4;
      display: none;
    }
    .status.success {
      display: block;
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .status.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .hint {
      font-size: 10px;
      color: #64748b;
      margin-top: 12px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">A</div>
    <div>
      <h1 class="title">AcadSphere CUE Sync</h1>
      <p class="subtitle">Extract live attendance from CUE Portal</p>
    </div>
  </div>

  <div class="form-group">
    <label for="userId">AcadSphere User ID</label>
    <input type="text" id="userId" placeholder="Paste your User ID from AcadSphere" />
  </div>

  <button id="syncBtn" class="btn">Sync to AcadSphere</button>

  <div id="statusMsg" class="status"></div>

  <p class="hint">
    Make sure you are on <strong>cue.christuniversity.in/main/attendence</strong> before clicking Sync.
  </p>

  <script src="popup.js"></script>
</body>
</html>
